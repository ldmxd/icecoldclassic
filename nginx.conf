# IceColdClassic.Site — nginx config for the static site container.
# The droplet's outer Nginx reverse-proxies icecoldclassic.com.au -> this container on :8080.

server {
    listen       8080;
    server_name  _;
    root         /usr/share/nginx/html;
    index        index.html;

    # ── Compression ────────────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/javascript
        text/xml
        application/javascript
        application/json
        application/xml
        application/xml+rss
        application/rss+xml
        application/atom+xml
        image/svg+xml;

    # ── Security headers ───────────────────────────────────────────
    add_header X-Frame-Options             "SAMEORIGIN"           always;
    add_header X-Content-Type-Options      "nosniff"              always;
    add_header Referrer-Policy             "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy          "geolocation=(), microphone=(), camera=()" always;

    # ── Caching ────────────────────────────────────────────────────
    # HTML — short cache so content updates roll out quickly.
    location ~* \.html$ {
        add_header Cache-Control "public, max-age=300, must-revalidate";
    }

    # Assets (images, fonts, css, js) — long cache, immutable.
    location ~* \.(?:png|jpg|jpeg|gif|webp|svg|ico|woff2?|ttf|css|js|otf)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        access_log off;
    }

    # ── Routing ────────────────────────────────────────────────────
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Hide nginx version on errors.
    server_tokens off;

    # 404 -> just serve index.html (one-page site).
    error_page 404 /index.html;
}
